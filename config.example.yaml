# BossHunter 配置文件
# 复制此文件为 config.yaml 并修改为你的实际配置

profile:
  resume_path: "./resume.md"
  resume_output_dir: "./data/resumes"
  target_roles: ["你的目标岗位1", "目标岗位2", "目标岗位3"]
  target_cities: ["北京"]
  salary_min: 15  # K
  salary_max: 25  # K
  allow_internship: false
  deal_breakers: ["外包", "996"]
  jd_deal_breakers: []  # 示例：需要排除完整 JD 中的词时再填写
  blocked_companies: [] # 示例：不希望采集的公司名称或关键词
  # 可选：个人亮点（用于招呼语生成）
  extra_highlights:
    - "你的核心竞争力描述"
  # 可选：在线作品集链接
  portfolio_url: ""

search:
  keywords: ["关键词1", "关键词2"]
  cities: ["北京"]
  city_codes: {}  # 自定义城市名称 -> 平台城市编码，由配置页自动填写
  max_pages: 5
  sort: newest

collection:
  default_order: [boss]
  auto_score_default: false
  default_target_count: 10

platforms:
  boss:
    enabled: true
    search:
      keywords: ["关键词1", "关键词2"]
      cities: ["北京"]
      city_codes: {}
      max_pages: 5
      sort: newest
      target_count: 10
  zhilian:
    enabled: false
    search:
      keywords: []
      cities: []
      # 只需填写城市名称；BossHunter 会从内置智联目录自动匹配城市编码。
      city_codes: {}
      max_pages: 3
      sort: default
      target_count: 10

scoring:
  threshold: 70
  max_candidates: 20

throttle:
  daily_limit: 30
  interval_min: 60
  interval_max: 180
  browse_before_greet: true
  browse_duration_min: 15
  browse_duration_max: 30
  send_windows:
    - "09:00-17:00"
  day_off_probability: 0.05

ai:
  provider: "anthropic"
  service: "anthropic"           # anthropic / deepseek / doubao / custom
  model: "claude-sonnet-4-6"
  thinking: "auto"               # auto / disabled / enabled / off
  thinking_budget: 2048           # thinking=enabled 时使用，至少 1024
  timeout_seconds: 180
  scoring_max_tokens: 8192
  scoring_max_attempts: 2
  scoring_concurrency: 1          # AI评分并发数，范围1-3；数据库仍串行写入
  scoring_second_review: false    # 可选：对68-79分临界岗位进行一次独立复核
  greeting_max_tokens: 8192
  greeting_review_max_tokens: 4096
  greeting_max_attempts: 2
  # 可选：为不同任务覆盖通用 thinking 与超时设置
  # scoring_thinking_mode: "enabled"
  # scoring_timeout_seconds: 180
  # greeting_thinking_mode: "auto"
  # greeting_timeout_seconds: 180
  greeting_review_threshold: 7
  greeting_max_iterations: 2
  resume_max_pages: 3
  # api_key 可通过对应环境变量设置（ANTHROPIC_API_KEY / DEEPSEEK_API_KEY / ARK_API_KEY / OPENAI_API_KEY）
  # api_key: "your-api-key"
  # base_url: "https://api.anthropic.com"

monitor:
  interval: 30
  chat_url: "https://www.zhipin.com/web/geek/chat"
  max_resume_sends_per_cycle: 5
  auto_reply_hr_questions: false

follow_up:
  enabled: false
  interval_hours: 30
  skip_weekends: true

dedup:
  history_file: "./data/history.jsonl"

browser:
  runtime: "builtin"
  proxy_host: "127.0.0.1"
  proxy_port: 3456
  chrome_ports: [9222, 9229, 9333]
  auto_start_proxy: true
  enable_port_guard: true
  site_patterns: true
